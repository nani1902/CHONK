[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chonk"
version = "0.2.0"
description = "Fit a PDF under a size limit, locally; an MCP server that lets an AI agent do it without seeing the document."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.11"
dependencies = [
    "pypdf>=6.0,<7",
    "pypdfium2>=4.30,<6",
    "Pillow>=10.1",
    "numpy>=1.26",
]

[project.optional-dependencies]
mcp = ["mcp>=2.2,<3"]
# Offline OCR with bundled ONNX models. rapidocr-onnxruntime supports Python < 3.13.
ocr = ["rapidocr-onnxruntime>=1.4,<2; python_version < '3.13'"]
test = ["pytest>=8"]

[project.scripts]
chonk = "chonk.cli:main"

[tool.setuptools]
packages = ["chonk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
